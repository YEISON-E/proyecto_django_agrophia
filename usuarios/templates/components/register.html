{% load static %}

<link rel="stylesheet" href="{% static 'css/main.css' %}">

<div class="form-content__register">
  <h2 class="form__title">Formulario de Registro</h2>

  <div class="form-content__register-row">

  <div class="profile-update__group-file__photo">
          <img id="preview" src="{% static 'img/foto_sofi.png' %}" alt="foto de Perfil cargada" class="profile-update__group-file__photo_review">
          
          <!-- Label que actúa como botón -->
          <label for="input-foto" class="profile-update__label--file">
            Cambiar foto
          </label>
          <input id="input-foto" class="profile-update__input profile-update__input--file" type="file" name="foto"/>
          
          <!-- Aquí se mostrará el nombre de la foto seleccionada -->
          <!-- <span id="file-name" class="profile-update__file-name">Ningún archivo seleccionado</span> -->
        </div>
  <form id="register-form" method="POST" onsubmit="mostrarAlerta(event)" class="form-content__group" enctype="multipart/form-data">
  {% csrf_token %}

    <div class="form__group">
      <label for="tdocumento" class="form__label">Tipo de Documento</label>
      <select id="tdocumento" name="tdocumento" class="form__option" required>
      <option value="">-- Tipo de documento --</option>
      <option value="cc">CC</option>
      <option value="ti">TI</option>
      <option value="cedula extranjera">Cédula extranjera</option>
      <option value="pasaporte">Pasaporte</option>
    </select>
      
    </div>
    <div class="form__group">
      <label for="documento" class="form__label">Número de Documento</label>
      <input type="text" name="documento" class="form__input" placeholder="Número de documento">
    </div>

    <div class="form__group">
      <label for="nombres" class="form__label">Nombres</label>
      <input type="text" name="nombres" class="form__input" placeholder="Nombres">
    </div>

    <div class="form__group">
      <label for="apellidos" class="form__label">Apellidos</label>
      <input type="text" name="apellidos" class="form__input" placeholder="Apellidos">
    </div>
  </form>
  </div>

  <div class="form-content__register--row-buttons">
    <a href="{% url 'login' %}"
    class="form-content__register--row-buttons__back">
    Volver
  </a>
  <button type="submit" form="register-form" class="form-content__register--row-buttons__next">Siguiente</button>

  </div>
</div>

<script>
document.getElementById("input-foto").onchange = function(e){
    let reader = new FileReader();
    reader.onload = function(){
        document.getElementById("preview").src = reader.result;
    }
    reader.readAsDataURL(e.target.files[0]);
}
</script>
