<table class="home-table">
  <thead class="home-table__head">
    <tr class="home-table__row home-table__row--head">
      <th class="home-table__header">Fecha</th>
      <th class="home-table__header">Tipo</th>
      <th class="home-table__header">Descripción</th>
    </tr>
  </thead>
  <tbody class="home-table__body">
    {% for evento in eventos %}
    <tr class="home-table__row">
      <td class="home-table__cell">{{ evento.fecha }}</td>
      <td class="home-table__cell">{{ evento.tipo }}</td>
      <td class="home-table__cell">{{ evento.descripcion }}</td>
    </tr>
    {% empty %}
    <tr><td colspan="3">No hay eventos recientes.</td></tr>
    {% endfor %}
  </tbody>
</table>
