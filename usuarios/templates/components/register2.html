{% load static %}

<link rel="stylesheet" href="{% static 'css/main.css' %}">

<div class="form-content__register">
  <h2 class="form__title">Formulario de Registro</h2>
  <form id="register-form" method="POST" onsubmit="mostrarAlerta(event)" class="form-content__group2">
  {% csrf_token %}
    

    <div class="form__group">
      <label for="email" class="form__label">Correo Electrónico</label>
      <input type="email" name="email" class="form__input" placeholder="Correo Electrónico">
    </div>

    <div class="form__group">
      <label for="telefono" class="form__label">Teléfono</label>
      <input type="tel" name="telefono" class="form__input" placeholder="Teléfono">
    </div>

    <div class="form__group">
      <label class="form__label" for="input-departament">Departamento</label>
      <select id="input-departament" name="departamento" class="form__option">
        <option value="">Selecciona el Departamento</option>
        <option value="Risaralda">Risaralda</option>
        <option value="Caldas">Caldas</option>
        <option value="Quindio">Quindio</option>
      </select>
    </div>
      
      <div class="form__group">
        <label class="form__label" for="input-municipality">Municipio</label>
          <select id="input-municipality" name="municipio" class="form__option">
            <option value="">Selecciona el Municipio</option>
          </select>
      </div>
      
    <div class="form__group">
      <label for="direccion" class="form__label">Dirección completa</label>
      <input type="text" class="form__input" name="direccion" placeholder="Dirección completa">
    </div>
    
    <div class="register__group-textarea">
          <label class="profile-update__label" for="input-descripcion">Descripción de perfil (opcional)</label>
          <textarea id="input-direccion" class="register__textarea" type="text" name="descripcion" placeholder="Maximo 40 Caracteres" autocomplete="street-address" required ></textarea>
        </div>
    <div class="form__group">
      <label for="password" class="form__label">Contraseña</label>
      <input id="password" type="password" name="password" class="form__input" placeholder="Contraseña">

        <div class="form__check">
          <label class="form__label form__see--password">
            <input id="mostrar" type="checkbox">
            Mostrar contraseña
          </label>
        </div>
    </div>
  
    <div class="form__group">
        <label for="password" class="form__label"> Confirmar Contraseña</label>
        <input type="password" name="confirm_password" class="form__input" placeholder="Contraseña">
    </div>

    
  </form>


   <div class="form-content__register--row-buttons">
     <a href="{% url 'register' %}"
     class="form-content__register--row-buttons__back">
     Volver
    </a>
    <button type="submit" form="register-form" class="form-content__register--row-buttons__next">Registrarse</button>
    </div>
    
    <script>
    // Mapa simple de departamentos -> municipios
    const municipiosPorDepartamento = {

      'Risaralda': [
        'Pereira',
        'Dosquebradas',
        'La Virginia',
        'Apía',
        'Balboa',
        'Belén de Umbría',
        'Guática',
        'La Celia',
        'Marsella',
        'Mistrató',
        'Pueblo Rico',
        'Quinchía',
        'Santa Rosa de Cabal',
        'Santuario'
      ],

      'Caldas': [
        'Manizales',
        'Aguadas',
        'Anserma',
        'Aranzazu',
        'Belalcázar',
        'Chinchiná',
        'Filadelfia',
        'La Dorada',
        'La Merced',
        'Manzanares',
        'Marmato',
        'Marquetalia',
        'Marulanda',
        'Neira',
        'Norcasia',
        'Pácora',
        'Palestina',
        'Pensilvania',
        'Riosucio',
        'Risaralda',
        'Salamina',
        'Samaná',
        'San José',
        'Supía',
        'Victoria',
        'Villamaría',
        'Viterbo'
      ],

      'Quindio': [
        'Armenia',
        'Buenavista',
        'Calarcá',
        'Circasia',
        'Córdoba',
        'Filandia',
        'Génova',
        'La Tebaida',
        'Montenegro',
        'Pijao',
        'Quimbaya',
        'Salento'
      ]
    };

    const departSelect = document.getElementById('input-departament');
    const munSelect = document.getElementById('input-municipality');

    function poblarMunicipios() {
      const dep = departSelect.value;
      // limpiar
      munSelect.innerHTML = '<option value="">Selecciona el Municipio</option>';
      if (!dep || !municipiosPorDepartamento[dep]) return;
      municipiosPorDepartamento[dep].forEach(m => {
        const opt = document.createElement('option');
        opt.value = m;
        opt.textContent = m;
        munSelect.appendChild(opt);
      });
    }

    departSelect.addEventListener('change', poblarMunicipios);

    // Mostrar/ocultar contraseña
    const mostrarChk = document.getElementById('mostrar');
    const passField = document.getElementById('password');
    const confirmField = document.querySelector('input[name="confirm_password"]');
    mostrarChk.addEventListener('change', function(){
      const tipo = this.checked ? 'text' : 'password';
      if(passField) passField.type = tipo;
      if(confirmField) confirmField.type = tipo;
    });
    </script>
</div>
