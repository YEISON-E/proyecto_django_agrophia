{% load static %}

<link rel="stylesheet" href="{% static 'css/main.css' %}">

<div class="form-content__register">
  <h2 class="form__title">Formulario de Registro</h2>

  <div class="form-content__register-row">

  <form id="register-form-step1" method="POST" onsubmit="return validarRegistroStep1(event)" class="form-content__group" enctype="multipart/form-data" autocomplete="on">
  {% csrf_token %}

    <div class="profile-update__group-file__photo">
      <img id="preview" src="{% static 'img/not-found.png' %}" alt="foto de Perfil cargada" class="profile-update__group-file__photo_review">
      
      <!-- Label que actúa como botón -->
      <label for="input-foto" class="profile-update__label--file">
        Cambiar foto
      </label>
      <input id="input-foto" class="profile-update__input profile-update__input--file" type="file" name="foto"/>
      
      <!-- Aquí se mostrará el error de foto -->
    </div>
    <div class="form-group__container">

      
      <div class="form__group">
        <label for="tdocumento" class="form__label">Tipo de Documento</label>
        <select id="tdocumento" name="tdocumento" class="form__option" required>
          <option value="">-- Tipo de documento --</option>
          <option value="cc" {% if valores.tdocumento == 'cc' %}selected{% endif %}>CC</option>
          <option value="ti" {% if valores.tdocumento == 'ti' %}selected{% endif %}>TI</option>
        </select>
    
      </div>
      <div class="form__group">
        <label for="documento" class="form__label">Número de Documento</label>
        <input type="text" name="documento" class="form__input" placeholder="Número de documento" value="{{ valores.documento|default:'' }}" autocomplete="username" inputmode="numeric" spellcheck="false">
      </div>
      
      <div class="form__group">
        <label for="nombres" class="form__label">Nombres</label>
        <input type="text" name="nombres" class="form__input" placeholder="Nombres" value="{{ valores.nombres|default:'' }}" autocomplete="given-name" minlength="2" maxlength="40" pattern="[A-Za-zÁÉÍÓÚáéíóúÑñÜü\s']+" title="Solo letras y espacios (2 a 40 caracteres)">
      </div>
      
      <div class="form__group">
        <label for="apellidos" class="form__label">Apellidos</label>
        <input type="text" name="apellidos" class="form__input" placeholder="Apellidos" value="{{ valores.apellidos|default:'' }}" autocomplete="family-name" minlength="2" maxlength="40" pattern="[A-Za-zÁÉÍÓÚáéíóúÑñÜü\s']+" title="Solo letras y espacios (2 a 40 caracteres)">
      </div>
    </div>
  </form>
  </div>

  <div class="form-content__register--row-buttons">
    <a href="{% url 'usuarios:index' %}"
    class="form-content__register--row-buttons__back">
    Volver
  </a>
  <button type="submit" form="register-form-step1" class="form-content__register--row-buttons__next">Siguiente</button>

  </div>
</div>

<script src="{% static 'js/components/register.js' %}"></script>
