{% load static %}

<div class="product-form__content">
  <div class="product-form__container">
    <h2 class="product-form__subtitle">Subir producto</h2>
  </div> 
  <div class="product-form">

    <div class="product-form__upload">
      <label for="input-fotos-producto" class="product-form__dropzone" id="dropzone-fotos-producto">
        <strong>Arrastra imágenes aquí o haz clic para seleccionar</strong>
        <span id="fotos-counter" class="product-form__counter">0/8 fotos cargadas</span>
      </label>
      <input id="input-fotos-producto" class="product-form_input--file" type="file" name="fotos" accept="image/*" multiple />
      <div id="error-fotos-producto" class="input-error" style="display: none;"></div>
      <div id="fotos-preview" class="product-form__preview-grid"></div>
    </div>

    <div class="product-form__fields">
      <form id="create-product-step1-form" class="product-form__body">
        
        <div class="product-form__group">
          <label for="nombre-producto" class="product-form__label">Nombre del producto</label>
          <input id="nombre-producto" name="nombre" type="text" class="product-form__input" placeholder="Ej: Tomates frescos" required>
          <div id="error-nombre-producto" class="input-error" style="display: none;"></div>
        </div>

        <div class="product-form__group">
          <label for="tipo-producto" class="product-form__label">Tipo de producto</label>
          <select id="tipo-producto" name="tipo" class="product-form__input" required>
            <option value="">-- Selecciona --</option>
            <option value="Frutas">Frutas</option>
            <option value="Vegetales">Vegetales</option>
            <option value="Lácteos">Lácteos</option>
            <option value="Carne">Carne</option>
            <option value="Granos">Granos</option>
            <option value="Otros">Otros</option>
          </select>
          <div id="error-tipo-producto" class="input-error" style="display: none;"></div>
        </div>

        <div id="group-tipo-producto-otro" class="product-form__group" style="display: none;">
          <label for="tipo-producto-otro" class="product-form__label">Especifica el tipo</label>
          <input id="tipo-producto-otro" name="tipo_otro" type="text" class="product-form__input" placeholder="Ej: Hierbas aromáticas">
          <div id="error-tipo-producto-otro" class="input-error" style="display: none;"></div>
        </div>

        <div class="product-form__group">
          <label for="unidad-producto" class="product-form__label">Unidad de medida</label>
          <select id="unidad-producto" name="unidad" class="product-form__input" required>
            <option value="">-- Selecciona --</option>
            <option value="Libra">Libra</option>
            <option value="Kilo">Kilo</option>
            <option value="Arroba">Arroba</option>
            <option value="Litro">Litro</option>
          </select>
          <div id="error-unidad-producto" class="input-error" style="display: none;"></div>
        </div>

        

        
      </form>
    </div>
    </div>

  <div class="product-form__row ">
    <a href="{% url 'tiendas:interface_farmer' %}" class="product-form__row--back">Volver</a>
    <a id="btn-next-step-producto" href="{% url 'tiendas:create_product2' %}" class="product-form__row--next">Siguiente</a>

  </div>

</div>
