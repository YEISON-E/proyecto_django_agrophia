{% load static %}
<link rel="stylesheet" href="{% static 'css/main.css' %}">

<div class="login-container">
  <form method="POST" action="{% url 'usuarios:logout' %}" style="display: inline; margin: 0; padding: 0;">
    {% csrf_token %}
    <button type="submit" class="login__back">← Volver al inicio</button>
  </form>

  <div class="login-container__card">
    <div class="login">
      <h1 class="login__title">Iniciar Sesión</h1>

      <form method="POST" class="login-form">
        {% csrf_token %}

        {% if errores.general %}
          <div class="error-box" style="display: none;">
            {{ errores.general|safe }}
          </div>
        {% endif %}

        <div class="login-form__container">
          <label for="id_username" class="login-form__container__label">Número de documento</label>
          <input type="text" id="id_username" class="login-form__container__input" name="username" placeholder="Número de documento" value="{{ valores.username|default:'' }}" required />
          <div id="error-username" class="input-error" style="display: none;">
            {% if errores.username %}{{ errores.username }}{% endif %}
          </div>
        </div>

        <div class="login-form__container">
          <label for="id_password" class="login-form__container__label">Contraseña</label>
          <input type="password" id="id_password" class="login-form__container__input" name="password" placeholder="Contraseña" required />
        </div>

        <div class="login__show-password">
          <input type="checkbox" id="toggle-password" class="login-form__checkbox"/>
          <label for="toggle-password" class="login-form__checkbox-label">Mostrar contraseña</label>
        </div>

        <button type="submit" class="login__button">Iniciar sesión</button>
      </form>

      <a href="{% url 'usuarios:forgot_password' %}" class="login-container__register">
        ¿Olvidaste tu contraseña?
      </a>
    </div>
  </div>
</div>

<script src="{% static 'js/components/login.js' %}"></script>
