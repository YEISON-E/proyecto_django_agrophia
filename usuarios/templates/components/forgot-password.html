{% load static %}

<link rel="stylesheet" href="{% static 'css/main.css' %}">

<div class="container-forgot__password">

  <div class="forgot-password">
    <h2 class="forgot-password__title">Agrophia</h2>
    
    <div class="forgot-password__card">
      <p class="forgot-password__description">Ingresa tu correo electrónico para <br> restablecer la contraseña</p>
      
    <form method="POST" class="forgot-password__form">
      {% csrf_token %}

      {% if errores.general %}
        <div class="error-box">{{ errores.general }}</div>
      {% endif %}

      {% if mensaje %}
        <div class="success-box">{{ mensaje }}</div>
      {% endif %}

      <div class="forgot-password__group">
        <label class="forgot-password__label">Correo Electrónico</label>
        <input
          type="email"
          id="id_email"
          name="email"
          placeholder="Correo electrónico"
          class="forgot-password__input"
          value="{{ valores.email|default:'' }}"
          required
        >
        <div id="error-email" class="input-error" style="display: none;">
          {% if errores.email %}{{ errores.email }}{% endif %}
        </div>
      </div>

      <button type="submit" class="forgot-password__btn">
        Enviar código
      </button>
    </form>
    </div>
  </div>
<a href="{% url 'usuarios:login' %}" class="reset__back">Volver</a>

  
</div>

<link rel="stylesheet" href="{% static 'css/forloggin.css' %}">
<script src="{% static 'js/components/forgot-password.js' %}"></script>
